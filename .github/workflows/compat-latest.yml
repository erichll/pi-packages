name: pi-subagents compatibility

# Detects drift against the newest published pi-subagents before it surprises
# users, without relying on a manual devDependency bump each release.
#
# Jobs:
#   - pinned-suite : regression canary against the committed (pinned) deps.
#   - latest-compat: re-runs the type check + test suite against the *latest*
#                    pi-subagents to surface early compatibility signals.
#   - model-gate   : opt-in end-to-end gate. Only activates when
#                    PI_SUBAGENTS_GATE_MODEL and a matching model credential
#                    secret are configured; otherwise it is inert.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly (04:17 UTC). Catch upstream releases that land outside PR hours.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-suite:
    name: Pinned suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install sandbox runtime host dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep bubblewrap socat
      - name: Type check + tests (pinned)
        run: |
          echo "Pinned pi-subagents: $(node -p "require('./node_modules/pi-subagents/package.json').version")"
          npm run check
          npm test

  latest-compat:
    name: Latest pi-subagents drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record pinned version
        id: pinned
        run: echo "version=$(node -p "require('./node_modules/pi-subagents/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install latest pi-subagents
        run: npm install -D -E pi-subagents@latest --workspace packages/pi-sandbox
      - name: Show version drift
        run: |
          echo "Pinned: ${{ steps.pinned.outputs.version }} -> Latest: $(node -p "require('./node_modules/pi-subagents/package.json').version")"
      - name: Install sandbox runtime host dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep bubblewrap socat
      - name: Type check + tests (latest)
        run: |
          npm run check
          npm test

  # NOTE: `secrets` cannot be referenced from a job-level `if`. The opt-in is
  # therefore implemented by importing the secrets into a job-level `env` and
  # gating each step with `if: env.PI_SUBAGENTS_GATE_MODEL != ''`. When no
  # model secret is configured, the job prints a skip notice and is green.
  model-gate:
    name: Model-backed compat gate (opt-in)
    runs-on: ubuntu-latest
    env:
      PI_SUBAGENTS_GATE_MODEL: ${{ secrets.PI_SUBAGENTS_GATE_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY }}
    steps:
      - name: Skip unless a model secret is configured
        if: env.PI_SUBAGENTS_GATE_MODEL == ''
        run: echo "model-gate skipped (PI_SUBAGENTS_GATE_MODEL not configured)"; exit 0
      - name: Checkout
        if: env.PI_SUBAGENTS_GATE_MODEL != ''
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.PI_SUBAGENTS_GATE_MODEL != ''
        with:
          node-version: 22
          cache: npm
      - name: Install tmux + sandbox runtime host dependencies
        if: env.PI_SUBAGENTS_GATE_MODEL != ''
        run: sudo apt-get update && sudo apt-get install -y tmux ripgrep bubblewrap socat
      - run: npm ci
        if: env.PI_SUBAGENTS_GATE_MODEL != ''
      - name: Install latest pi-subagents
        if: env.PI_SUBAGENTS_GATE_MODEL != ''
        run: npm install -D -E pi-subagents@latest --workspace packages/pi-sandbox
      - name: Install pi binary (PI_SUBAGENTS_GATE_PI_BINARY)
        if: env.PI_SUBAGENTS_GATE_MODEL != ''
        run: npm i -g @earendil-works/pi-coding-agent
      - name: Run compatibility gate
        if: env.PI_SUBAGENTS_GATE_MODEL != ''
        run: npm run gate:pi-subagents
